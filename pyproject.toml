[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-conformal-shift"
version = "1.0.0"
description = "Adaptive Conformal Prediction under Distribution Shift: an empirical study of drift-aware calibration for regression"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "scipy>=1.11", "matplotlib>=3.8", "PyYAML>=6.0", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
